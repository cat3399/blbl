name: Android API19 Build

on:
  push:
    branches:
      - mtga-api19-main
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name used in the APK metadata"
        required: false
        default: "ci"

permissions:
  contents: read

jobs:
  build-api19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android package tools
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager" && -d "$sdk_root/cmdline-tools" ]]; then
            sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1 || true)"
          fi
          test -x "$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "build-tools;35.0.0"

      - name: Prepare optional release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
          else
            echo "No release keystore configured; the APK will be unsigned."
          fi

      - name: Build KitKat release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          version_name="${INPUT_VERSION_NAME:-}"
          if [[ -z "$version_name" ]]; then
            version_name="ci-${GITHUB_SHA::7}"
          fi
          ./gradlew :app:assembleKitkatRelease \
            -PversionName="$version_name" \
            -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Inspect APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk -type f -name '*.apk' | sort | tail -n 1)"
          test -n "$apk"
          test -s "$apk"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          aapt="$(command -v aapt2 || true)"
          apksigner="$(command -v apksigner || true)"
          if [[ -z "$aapt" && -d "$sdk_root/build-tools" ]]; then
            aapt="$(find "$sdk_root/build-tools" -name aapt2 -perm -u+x | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$apksigner" && -d "$sdk_root/build-tools" ]]; then
            apksigner="$(find "$sdk_root/build-tools" -name apksigner -perm -u+x | sort -V | tail -n 1 || true)"
          fi
          echo "aapt2: ${aapt:-missing}"
          echo "apksigner: ${apksigner:-missing}"
          test -x "$aapt"
          test -x "$apksigner"
          badging="$RUNNER_TEMP/api19-badging.txt"
          "$aapt" dump badging "$apk" | tee "$badging"
          grep -F "sdkVersion:'19'" "$badging"
          echo "Native libraries in APK:"
          unzip -Z1 "$apk" | grep '^lib/' || true
          unzip -l "$apk" | grep -F "lib/armeabi-v7a/libijkplayer.so"
          if unzip -l "$apk" | grep -E "lib/(arm64-v8a|x86|x86_64)/"; then
            echo "Unexpected non-ARM32 native library found in API19 APK." >&2
            exit 1
          fi

          signature_status="unsigned"
          if "$apksigner" verify --verbose "$apk"; then
            signature_status="signed"
            "$apksigner" verify --print-certs "$apk"
          fi
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          {
            echo "## API19 APK"
            echo
            echo "- Path: `$apk`"
            echo "- SHA-256: `$apk_sha256`"
            echo "- Signature: `$signature_status`"
            echo "- ABI: `armeabi-v7a`"
            echo "- minSdk: `19`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KitKat release APK
        uses: actions/upload-artifact@v4
        with:
          name: blbl-api19-kitkat-release-${{ github.sha }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
