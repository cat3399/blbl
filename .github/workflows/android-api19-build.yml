name: Android API19 Build

on:
  push:
    branches:
      - mtga-api19-main
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name used in the APK metadata"
        required: false
        default: "ci"

permissions:
  contents: read

jobs:
  build-api19:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare optional release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_KEYSTORE_BASE64:-}" ]]; then
            mkdir -p keystore
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/release.keystore
          else
            echo "No release keystore configured; the APK will be unsigned."
          fi

      - name: Build KitKat release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          version_name="${INPUT_VERSION_NAME:-}"
          if [[ -z "$version_name" ]]; then
            version_name="ci-${GITHUB_SHA::7}"
          fi
          ./gradlew :app:assembleKitkatRelease \
            -PversionName="$version_name" \
            -PversionCode="$GITHUB_RUN_NUMBER"

      - name: Inspect APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/kitkat/release/app-kitkat-release.apk"
          test -s "$apk"
          echo "AAPT2 is unavailable on this runner; checking the packaged manifest produced by AGP."
          manifest="$(find app/build/intermediates -name AndroidManifest.xml -print0 2>/dev/null \
            | xargs -0 -r grep -alE 'minSdkVersion[^0-9]{0,16}19([^0-9]|$)' \
            | head -n 1 || true)"
          test -n "$manifest"
          echo "Manifest: $manifest"
          grep -aE '([[:space:]]|:)minSdkVersion[=:" ]+19(["[:space:]]|$)' "$manifest"
          unzip -l "$apk" | grep -F "lib/armeabi-v7a/libijkplayer.so"
          if unzip -l "$apk" | grep -E "lib/(arm64-v8a|x86|x86_64)/"; then
            echo "Unexpected non-ARM32 native library found in API19 APK." >&2
            exit 1
          fi

          signature_status="unsigned"
          if unzip -Z1 "$apk" | grep -Eq '^META-INF/[^/]+\.(RSA|DSA|EC)$'; then
            signature_status="signed (certificate entry)"
          fi
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          {
            echo "## API19 APK"
            echo
            echo "- Path: `$apk`"
            echo "- SHA-256: `$apk_sha256`"
            echo "- Signature: `$signature_status`"
            echo "- ABI: `armeabi-v7a`"
            echo "- minSdk: `19`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KitKat release APK
        uses: actions/upload-artifact@v4
        with:
          name: blbl-api19-kitkat-release-${{ github.sha }}
          path: app/build/outputs/apk/kitkat/release/app-kitkat-release.apk
          if-no-files-found: error
